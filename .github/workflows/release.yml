name: Release
permissions:
  contents: read
concurrency:
  group: release-master
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name
      == github.repository
    uses: json-schema-tools/foundation/.github/workflows/release.yml@66e2ac8fb6a5f53bbd4f1a34468e14ea7c9333a8
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
      pages: write
    with:
      build-command: npm run build
      test-command: npm test -- --runInBand
      rust-tests: true
      release-assets: '["index.js", "index.d.ts", "index.py", "json_schema.go", "schema.json"]'
      deploy-schema: true
      schema-destination: s3://meta.json-schema.tools/latest.json
      cloudfront-distribution: E205UL06VEMZBZ
'on':
  workflow_run:
    workflows:
    - CI
    types:
    - completed
    branches:
    - master
