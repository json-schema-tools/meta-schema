name: Release
permissions:
  contents: read
concurrency:
  group: release-master
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name
      == github.repository
    uses: json-schema-tools/foundation/.github/workflows/release.yml@8efed1471e2e9121b06f897ee4c0f3d4f6f1c6f8 # v1.3.0
    secrets:
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
      pages: write
    with:
      build-command: npm run build
      test-command: npm test -- --runInBand
      rust-tests: true
      release-assets: '["index.js", "index.d.ts", "index.py", "json_schema.go", "schema.json"]'
      deploy-schema: true
      schema-destination: s3://meta.json-schema.tools/latest.json
'on':
  workflow_run:
    workflows:
    - CI
    types:
    - completed
    branches:
    - master
